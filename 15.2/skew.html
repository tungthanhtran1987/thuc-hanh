<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Skew</title>
    </head>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Oxygen,
                Ubuntu,
                Cantarell,
                "Open Sans",
                "Helvetica Neue",
                sans-serif;
        }

        .wrapper {
            display: flex;
            align-items: center;
            min-height: 100vh;
        }

        .album {
            position: relative;
            
        }

        .album::before {
            content: "";
            position: absolute;
            inset: -20% -50% -60%;
            background-color: orange;
            transform: skew(3deg, 5deg);
        }

        .inner {
            position: relative;
            width: 80%;
            margin: 0 auto;
        }

    
    </style>
    <body>
        <div class="wrapper">
            <div class="album">
                <div class="inner">
                    <h1>
                        Lorem ipsum dolor sit amet consectetur, adipisicing
                        elit.
                    </h1>
                    <p>
                        Lorem ipsum dolor sit amet consectetur adipisicing elit.
                        Doloremque error cumque itaque, nihil tenetur vel ad
                        nisi autem porro illo.
                    </p>
                </div>
            </div>
        </div>
    </body>
</html>
