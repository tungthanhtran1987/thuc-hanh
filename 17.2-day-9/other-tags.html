<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>other-tags</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            gap: 10px;
        }

        .container {
            width: 800px;
            max-width: 100%;
            margin: 0 auto;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table th,
        table td {
            border: 3px solid #ccc;
        }

        .table td {
            padding: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <table class="table">
            <thead>
                <tr>
                    <th width="180">Thu 2</th>
                    <th>Thu 3</th>
                    <th>Thu 4</th>
                    <th>Thu 5</th>
                    <th>Thu 6</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Văn</td>
                    <td>Toán</td>
                    <td>Tin</td>
                    <td>Hóa</td>
                    <td rowspan="2">Sử</td>
                </tr>
                <tr>
                    <td>Lý</td>
                    <td>Anh</td>
                    <td>Địa</td>
                    <td>GDCD</td>

                </tr>
                <tr>
                    <td>Thể dục</td>
                    <td>GDCD</td>
                    <td>Địa lý</td>
                    <td>Lịch sử</td>
                    <td>Hóa học</td>
                </tr>


            </tbody>
        </table>

    </div>


</body>

</html>
